name: Test

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.1.3
          pip install 'poetry-plugin-export>=1.8'
          poetry --version

      - name: Install Task
        run: |
          curl -sSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          task --version

      - name: Sync dependencies for a
        working-directory: test/a
        run: |
          poetry sync --no-root

      - name: Test & validate
        run: |
          task -d test validate-all

